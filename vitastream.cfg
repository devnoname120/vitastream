# Created automatically at ur0:/tai/vitastream.cfg; reboot after editing.
# Settings apply only while the host is streaming video and/or audio.
screen=on
# Local speakers/headphones; USB audio capture remains enabled in either mode.
speakers=on
# Use one video buffer and skip camera borrowing when enabled.
lowmemory=off
# Prevent automatic suspend only while USB video or audio capture is active.
nosleep=on
